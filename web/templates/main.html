<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <title>BLINDFOLD CHESS</title>
  </head>
  <body>
    <main>
      <div class="input-wrapper">
        <div class="state-wrapper">
          <p class="notification hide" id="notification"></p>

          <div class="move-input" id="moveInput">
            <input
              type="text"
              class="move-cell"
              data-index="0"
              maxlength="1"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              inputmode="text"
            />
            <input
              type="text"
              class="move-cell"
              data-index="1"
              maxlength="1"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              inputmode="text"
            />
            <input
              type="text"
              class="move-cell"
              data-index="2"
              maxlength="1"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              inputmode="text"
            />
            <input
              type="text"
              class="move-cell"
              data-index="3"
              maxlength="1"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              inputmode="text"
            />
          </div>

          <p class="turn" id="turn">ход белых</p>

          <div class="last-moves">
            <ul class="last-moves-list" id="lastMoves">
              <li>e2e4</li>
              <li>e2e4</li>
              <li>e2e4</li>
            </ul>
          </div>
        </div>

        <button class="move-btn" id="moveBtn">></button>
      </div>
    </main>

    <script src="/js/main.js"></script>
  </body>
</html>
